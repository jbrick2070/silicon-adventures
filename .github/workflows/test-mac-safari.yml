name: Test the browser edition on Mac

on: workflow_dispatch

permissions:
  contents: read

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [safari, chrome]
    name: Play on Mac with ${{ matrix.browser }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install selenium==4.36.0
      - if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - name: Play and restore a private browser save
        env:
          GAME_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          BROWSER: ${{ matrix.browser }}
        run: python game/tests/browser_smoke.py "$GAME_URL" "$BROWSER"
