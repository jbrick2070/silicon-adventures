<!doctype html><meta charset=utf-8><body style="margin:0;background:#222">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<canvas id=c width=512 height=512></canvas>
<script type=module>
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const r = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true});
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.15;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x24262b);
scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x3a3028, 1.1));
const key = new THREE.DirectionalLight(0xffe2b8, 3.2); key.position.set(-2, 3, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0xa0c0ff, 1.2); rim.position.set(3, 1, -3); scene.add(rim);
const cam = new THREE.PerspectiveCamera(22, 1, .01, 100);
let model = null, centre = new THREE.Vector3(), radius = 1;
window.load = url => new Promise((ok, no) => new GLTFLoader().load(url, g => {
  if (model) scene.remove(model);
  model = g.scene; scene.add(model);
  const box = new THREE.Box3().setFromObject(model), s = new THREE.Sphere(); box.getBoundingSphere(s);
  centre = s.center; radius = s.radius;
  let faces = 0, tex = 0; model.traverse(o => { if (o.isMesh) { faces += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; if (o.material.map) tex = o.material.map.image?.width || 1; } });
  ok({faces, tex, size: box.getSize(new THREE.Vector3()).toArray()});
}, undefined, no));
window.view = (az, el = .12) => {
  const d = radius * 2 / Math.tan(11 * Math.PI / 180) / 1.05;
  cam.position.set(centre.x + Math.sin(az) * Math.cos(el) * d, centre.y + Math.sin(el) * d, centre.z + Math.cos(az) * Math.cos(el) * d);
  cam.lookAt(centre); r.render(scene, cam);
  return document.getElementById('c').toDataURL('image/png');
};
window.ready = true;
</script>
