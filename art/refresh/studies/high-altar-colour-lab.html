  else if(m==5){dark=vec3(84,84,110);mid=vec3(145,139,151);lit=vec3(223,195,167);}
  else if(m==6){dark=vec3(116,69,74);mid=vec3(209,132,80);lit=vec3(255,208,132);}
  else {dark=vec3(100,76,69);mid=vec3(168,118,88);lit=vec3(224,175,119);}
  return mix(mix(dark,mid,min(1.,q*2.)),lit,max(0.,q*2.-1.))/255.;
}
// A single mineral wash runs up both courses, in the room's coordinates.
float violetAt(vec3 p){
  float veer=.21*sin(1.16*p.x+.78*p.z)+.10*cos(2.18*p.x-.59*p.z);
  float violet=1.-smoothstep(.04,2.60,p.y+veer);
  // Small palette intervals keep the stone graphic at Macintosh resolution.
  return floor(violet*10.+.5)/10.;
}
vec3 stone(float tint,float illumination){
  vec3 slate=pigment(2,illumination), plum=pigment(8,illumination);
  vec3 heather=vec3(5.,-2.,5.)/255.;
  return mix(slate,plum,tint)+heather*(4.*tint*(1.-tint));
}
void main(){
  ivec2 px=ivec2(int(gl_FragCoord.x),313-int(gl_FragCoord.y));
  bool inkPixel=texelFetch(inkImage,px,0).r<.5;
  vec3 ink=vec3(22,24,22)/255.;
  if(mode==0){color=vec4(inkPixel?ink:vec3(233,238,232)/255.,1);return;}
  ivec3 sampleData=ivec3(round(texelFetch(depthImage,px,0).rgb*255.));
  int region=sampleData.b;
  bool lower=region==8 || region==9, upper=region==10 || region==11;
  bool wall=lower || upper;
  int mat=wall?2:region;
  float t=float(sampleData.r*256+sampleData.g)/4096.;
  vec2 screen=vec2(px)+.5;
  vec3 p=vec3((screen.x-camera.x)/camera.z*t,camera.w+(camera.y-screen.y)/camera.z*t,t);
  float tint=finish==2 && wall?violetAt(p):float(finish==1 && lower);
  if(inkPixel){
    if(region==8 || region==10) ink=mix(ink,vec3(40,16,47)/255.,smoothstep(.02,.93,tint));
    color=vec4(ink,1);return;
  }
  if(mode==1){color=vec4(wall?stone(tint,.5):pigment(mat,.5),1);return;}
  vec3 n=normalize((texelFetch(normalImage,px,0).rgb*255.-128.)/127.);
  vec3 light=vec3(mix(-2.0,2.0,lamp),2.75,2.35);
  vec3 ray=light-p;
  float facing=max(0.,dot(n,normalize(ray)));
  float falloff=1./(1.+.085*dot(ray,ray));
  bool shadow=mat!=4&&(inShadow(p+n*.004,ray,0)||inShadow(p+n*.004,ray,1));
  float value=clamp(.19+.09*max(n.y,0.)+1.30*facing*falloff*(shadow?.13:1.),0.,1.);
  float band=floor(value*4.+.5)/4.;
  color=vec4(wall?stone(tint,band):pigment(mat,band),1);
}`;
(async()=>{

 const program=gl.createProgram();
 for(const [type,source] of [[gl.VERTEX_SHADER,vertex],[gl.FRAGMENT_SHADER,fragment]]){
  const sh=gl.createShader(type);gl.shaderSource(sh,source);gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));

 }
 gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
 const loc=name=>gl.getUniformLocation(program,name);
 const imgs=await Promise.all(study.tex.map(async url=>{const im=new Image();im.src=url;await im.decode();return im;}));
 gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.NONE);
 imgs.forEach((im,i)=>{gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());

 gl.uniform1i(loc(['inkImage','normalImage','depthImage'][i]),i);});
 gl.uniform4fv(loc('camera'),study.rig);gl.uniform3fv(loc('walls[0]'),study.planes.flat());gl.uniform2fv(loc('heights[0]'),study.heights.flat());
 const buttons=[...document.querySelectorAll('[data-mode]')],slider=document.querySelector('#lamp');
 const finish=document.querySelector("#finish");
 let mode=2;
 function paint(){
  gl.uniform1i(loc('finish'),Number(finish.value));gl.uniform1i(loc('mode'),mode);gl.uniform1f(loc('lamp'),Number(slider.value)/100);gl.drawArrays(gl.TRIANGLES,0,3);
  buttons.forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.mode===mode)));
  slider.disabled=mode!==2;finish.disabled=mode===0;
 }
 buttons.forEach(b=>b.onclick=()=>{mode=Number(b.dataset.mode);paint()});slider.oninput=paint;finish.onchange=paint;paint();window.ready=true;
})().catch(e=>{document.querySelector('#info').textContent=e.message;console.error(e);});
